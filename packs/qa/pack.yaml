  - Tested
  - Automated
  - Validated
  - Verified
  - Reproduced
  - Documented
  - Reported
  - Triaged
  - Scripted
  - Executed
  - Isolated
  - Benchmarked
  - Hardened
  - Maintained
  - Improved
banned_phrases:
  - bug-free
  - zero defects
  - QA magic
  - quality champion
