metric_questions:
  - How many test cases or scenarios did you write?
  - What test coverage did you reach?
  - How many defects did you find before release?
  - How much did you reduce escaped defects or production bugs?
  - How much time did automation save per release?
  - How many release cycles or builds do you validate?
  - What was the pass rate or flakiness reduction?
