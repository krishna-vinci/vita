services:
  # Docker creates fresh bind directories as root; only their ownership changes.
  vita-init:
    image: ghcr.io/krishna-vinci/vita:latest
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 1000:1000 /data /pi-agent"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    healthcheck:
      disable: true
    volumes:
      - ./vita-home:/data
      - ./pi-agent:/pi-agent

  vita:
    image: ghcr.io/krishna-vinci/vita:latest
    # build: . # From a checkout: uncomment, then docker compose build
    restart: unless-stopped
    depends_on:
      vita-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      VITA_HOST: 0.0.0.0
      VITA_PORT: "4317"
      VITA_DATA_DIR: /data
      PI_CODING_AGENT_DIR: /pi-agent
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      - ./vita-home:/data
      - ./pi-agent:/pi-agent
